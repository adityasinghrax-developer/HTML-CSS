<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell</title>
</head>
<body>
    <h1>Coloum span</h1>
    <table border="1">
        <tr>
            <th colspan="2">Fruits store</th>
        </tr>
        <tr>
            <td>apple</td>
            <td>120</td>
        </tr>
        <tr>
            <td>Banana</td>
            <td>100</td>
        </tr>
    </table>
    <h1> Row span</h1>
    <table border="1">
        <tr>
            <td>Banana</td>
            <th rowspan="3">Fruits</th>
        </tr>
        <tr>
            <td>Mango</td>
        </tr>
        <tr>
            <td>Apple</td>
        </tr>
    </table>
    
</body>
</html>
