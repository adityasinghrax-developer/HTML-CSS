<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body> 
    <table border="5">
        <caption>Fruits List </caption>
        <thead>
            <tr>
                <th>Fruits</th>
                <th>Price</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Apple</td>
                <td>120</td>
            </tr>

            <tr>
                <td>Banana</td>
                <td>100</td>
            </tr>

            <tr>
                <td>Orange</td>
                <td>130</td>
            </tr>

            <tr>
                <td>Mango</td>
                <td>100</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td>Quantity : 4</td>
                <td>Price : 450</td>
            </tr>
        </tfoot>
        
        
    </table>
</body>
</html>
