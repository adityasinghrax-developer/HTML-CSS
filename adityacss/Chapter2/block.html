<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocks</title>
    <style>
       
        .block{
            background-color: azure;
            margin: 10px;
            padding: 20px;
            display: block;

        }
        .inline{
            display: inline;
            background-color: aqua;
            margin: 20px;
            padding: 5px;
        }
        .inline-blocks{
            display: inline-block;
            background-color: aquamarine;
            margin: 10px;
            padding: 20px;
            width: 100px;
            height: 50px;
        }
        .ima{
            align-items: center;
            width: 100%;
            height: 150%;
        }
    </style>
</head>
<body>
    <h1>Display:Block</h1>
    <div class="block">Box1(Block)</div>
    <div class="block">Box2(Block)</div>
    <p>This is full line Block</p>
    <h2 style="margin: 30px;">Display:inline</h2>
    <div class="inline">Words1</div>
    <div class="inline">Words3</div>
    <div class="inline">Words2</div>
    <p>This is inline blocks</p>
    <h2>Display:inline-blocks</h2>
    <div class="inline-blocks">BoxA</div>
    <div class="inline-blocks">BoxB</div>
    <div class="inline-blocks">BoxC</div><br><br>
    <img src="https://th.bing.com/th/id/OIP.1Kw_KPa_6DNqGVoL2PPDFwHaHa?w=236&c=11&rs=1&qlt=90&bgcl=ececec&o=6&pid=PersonalBing&p=0" class="ima" alt="Your brower is not support images" title="This is images">
</body>
</html>
