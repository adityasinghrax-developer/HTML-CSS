<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text shodow</title>
    <style>
        body{
            background-color: rgb(212, 213, 214);
            text-align: center;
        }
        h1{
            color: rgb(48, 46, 46);
            text-shadow: 1px 2px 3px rgb(198, 47, 47);
            letter-spacing: 1px;
        }
        button{
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        img{
            width: 380px ;
            min-height: 380px;
            filter: drop-shadow(5px 5px 10px #333);
        }
        img:hover img{
            scale: 1.2;
        }
    
    </style>
</head>
<body>
    <h1>This is our website</h1>
    <button type="button">
        content us
    </button>
    <img src="https://wallpaperaccess.com/full/2619622.jpg" alt="">
    
</body>
</html>
