<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
    <style>
        body{
            background-color: #f7f7f0;
            padding: 10px;
            margin: 10px;
        }
        .box{
            background: white;
            padding: 10px;
            margin: 10px;
            box-shadow: 1px 1px 2px  black;
            font-family: cursive;
            font-size: 20px;
            border-radius: 10px;
            text-transform: capitalize;
        }
        .rowflex{
            display: flex;
            border-radius: 10px;
            justify-content: center;
            align-items: center;

            border: 1px solid #ddd;
        }
        .columnflex{
            display: Flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
        .item{
            text-align: center;
            background:  rgb(236, 244, 88);
            margin: 10px;
            width: 40px;
            border: none;
            padding: 16px 8px;
            border-radius: 5px;
            box-shadow: 2px 2px 4px rgb(255, 255, 0);
            
        }
        
    </style>
    
  </head>
  <body>
      <h1>Flex : row and column</h1>
      <div class="box">
          <p>this is rowflex</p>
      <div class="rowflex">
          
      
          
        
          <div class="item">
              A
          </div>
          <div class="item">
              B
          </div>
          <div class="item">
              C
          </div>
          
        </div>
      </div>
      <div class="box">
          <p>This is column flex</p>
          <div class="columnflex">
              
          
          <div class="item">
              A
          </div>
          <div class="item">
              B
          </div>
          <div class="item">
              C
          </div>
          </div>
          
      </div>
      
  </body>
</html>
