
<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
    <style >
    body{
        background-color: #f4f4f4;
        padding: 10px;
    }
    .box{
        display: flex;
        box-shadow: 1px 1px 2px black;
        background-color: white;
        padding: 20px;
        border: 2px solid #f4f4f4;
        border-radius: 10px;
    
    }
    .item{
        background: lightblue;
        padding: 20px;
        margin: 10px;
        text-align: center;
        border-radius: 10px;
        letter-spacing: 1.5px;
        color: black;
        font-family: cursive;
        font-size: 25px;
        box-shadow: 1px 1px .5px black;
    }
        
    </style>
  </head>
  <body>
      <h1>Flex and item</h1>
      <div class="box">
          <div class="item">
              Box 1
          </div>
          <div class="item">
              Box 2
          </div>
          <div class="item">
              Box 3
          </div>
          
      </div>
  </body>
</html>
